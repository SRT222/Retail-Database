<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Retail Acquisition Explorer — SoCal &amp; Central Coast</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%97%BA%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --ink:#1B2430; --ink-soft:#3E4A59; --paper:#EEF1F4; --panel:#FFFFFF;
  --line:#D7DCE1; --brass:#B98B34; --brass-deep:#8F6A24; --slate:#5B6B7A; --pin:#2B3A55; --liked:#3F7D58;
  color-scheme: light;
}
:root:not([data-theme="light"]) {
  @media (prefers-color-scheme: dark) {
    --ink:#EDEFF2; --ink-soft:#B7C0CC; --paper:#12161C; --panel:#1A1F27;
    --line:#2A313B; --brass:#D3A24E; --brass-deep:#E7BE72; --slate:#8A97A5; --pin:#7C93B8; --liked:#5FA378;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --ink:#EDEFF2; --ink-soft:#B7C0CC; --paper:#12161C; --panel:#1A1F27;
  --line:#2A313B; --brass:#D3A24E; --brass-deep:#E7BE72; --slate:#8A97A5; --pin:#7C93B8; --liked:#5FA378;
  color-scheme: dark;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:'Inter',system-ui,sans-serif; font-variant-numeric: tabular-nums lining-nums;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
h1,h2,h3,.serif{font-family:'Fraunces',serif;}
a{color:inherit;}
button{font-family:inherit;}

header.top{
  padding: 16px 20px; padding-top:calc(16px + env(safe-area-inset-top,0px));
  border-bottom:1px solid var(--line); background:var(--panel);
  position:sticky; top:0; z-index:40;
}
.top-row{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; justify-content:space-between;}
.top-row h1{font-size:22px; font-weight:600; margin:0; letter-spacing:-0.01em;}
.top-row .count{font-size:13px; color:var(--slate);}
.logout{font-size:12.5px; color:var(--slate); text-decoration:underline; cursor:pointer; background:none; border:none;}

/* --------- filter bar --------- */
.filters{
  padding:14px 20px; background:var(--panel); border-bottom:1px solid var(--line);
  display:flex; flex-wrap:wrap; gap:14px 22px; align-items:flex-end;
}
.f-group{display:flex; flex-direction:column; gap:4px;}
.f-label{font-size:11px; color:var(--slate); font-weight:600;}
.f-range{display:flex; gap:6px; align-items:center;}
.f-range input[type=number]{
  width:92px; padding:6px 8px; border:1px solid var(--line); border-radius:6px;
  background:var(--paper); color:var(--ink); font-size:13px;
}
.f-range span{color:var(--slate); font-size:12px;}
.search-box{
  padding:7px 12px; border:1px solid var(--line); border-radius:6px;
  background:var(--paper); color:var(--ink); font-size:14px; min-width:200px;
}
select{
  padding:7px 10px; border:1px solid var(--line); border-radius:6px;
  background:var(--paper); color:var(--ink); font-size:13px;
}
.chip-row{display:flex; gap:6px; flex-wrap:wrap;}
.chip{
  padding:5px 11px; border:1px solid var(--line); border-radius:20px; font-size:12.5px;
  cursor:pointer; background:var(--paper); color:var(--ink-soft); user-select:none;
}
.chip.active{background:var(--ink); color:var(--panel); border-color:var(--ink);}
.reset-link{font-size:12.5px; color:var(--slate); text-decoration:underline; cursor:pointer; background:none; border:none; padding:6px 2px; align-self:flex-end;}
.reset-link.active{color:#C4453A; font-weight:700; text-decoration:none;}

/* --------- map hero --------- */
#map{width:100%; height:58vh; min-height:380px; background:#dfe3e6; position:relative;}
.marker-pin{border-radius:50%; border:1.5px solid #fff; box-shadow:0 1px 2px rgba(0,0,0,.4);}
.leaflet-popup-content{font-family:'Inter',sans-serif; font-size:13px;}
.popup-detail-btn{
  margin-top:6px; padding:5px 10px; border:1px solid var(--line); border-radius:5px;
  background:var(--ink); color:var(--panel); font-size:12px; font-weight:600; cursor:pointer; font-family:inherit;
}
.recenter-btn{
  width:30px; height:30px; background:#fff; border:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center; color:#1B2430;
}
.recenter-btn:hover{background:#f4f4f4;}

/* ---------- favorites & notes ---------- */
.heart-btn{
  background:none; border:none; cursor:pointer; font-size:17px; line-height:1; padding:2px 4px;
  color:#C4453A;
}
.heart-btn.liked{color:#C4453A;}
td.heart-cell{text-align:center; padding:6px 4px;}
.notes-cell{max-width:220px; white-space:normal; overflow:hidden; text-overflow:ellipsis;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; font-size:12.5px; color:var(--ink-soft);}
.notes-cell.empty{color:var(--slate); font-style:italic;}
.d-heart-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
.d-heart-row .heart-btn{font-size:24px;}
#notesBox{
  width:100%; min-height:80px; border:1px solid var(--line); border-radius:6px; padding:10px;
  background:var(--paper); color:var(--ink); font-family:inherit; font-size:13.5px; resize:vertical; box-sizing:border-box;
}
.notes-saved{font-size:11.5px; color:var(--slate); margin-top:4px; min-height:14px;}

/* --------- table --------- */
.table-wrap{padding:18px 20px 60px; overflow-x:auto;}
table{width:100%; border-collapse:collapse; font-size:13.5px; min-width:920px;}
thead th{
  text-align:left; padding:9px 10px; border-bottom:2px solid var(--line); cursor:pointer;
  white-space:nowrap; color:var(--ink-soft); font-weight:600; position:sticky; top:0; background:var(--paper);
}
thead th.sorted{color:var(--brass-deep);}
tbody td{padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap;}
tbody tr{cursor:pointer;}
tbody tr:hover{background:var(--panel);}
.num{text-align:right;}

/* --------- detail panel --------- */
.detail-overlay{
  position:fixed; inset:0; background:rgba(10,14,18,.4); z-index:2000;
  display:none; align-items:stretch; justify-content:flex-end;
}
.detail-overlay.open{display:flex;}
.detail-panel{
  width:min(520px, 100%); background:var(--panel); height:100%; overflow-y:auto;
  padding:22px 24px calc(28px + env(safe-area-inset-bottom,0px));
  box-shadow:-8px 0 24px rgba(0,0,0,.15);
}
.detail-close{
  float:right; background:none; border:1px solid var(--line); border-radius:6px;
  width:30px; height:30px; font-size:16px; cursor:pointer; color:var(--ink);
}
.d-addr{font-size:21px; font-weight:600; margin:2px 0 2px; font-family:'Fraunces',serif;}
.d-sub{font-size:13.5px; color:var(--ink-soft); margin-bottom:16px;}
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px 16px; margin-bottom:18px;}
.stat{border-top:1px solid var(--line); padding-top:6px;}
.stat-label{font-size:11px; color:var(--slate);}
.stat-value{font-size:15px; font-weight:600; margin-top:1px;}
.d-section{margin-bottom:16px;}
.d-section h4{font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--slate); margin:0 0 6px; font-weight:600;}
.d-section p{font-size:14px; line-height:1.55; margin:0 0 8px;}
.empty-note{font-size:13px; color:var(--slate); font-style:italic;}
.btn-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:6px;}
.btn{
  display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:6px;
  font-size:13.5px; font-weight:600; text-decoration:none; cursor:pointer; border:1px solid var(--line);
  background:var(--paper); color:var(--ink);
}
.btn.primary{background:var(--ink); color:var(--panel); border-color:var(--ink);}
.btn.brass{background:var(--brass); color:#241a06; border-color:var(--brass);}
.om-box{border:1px dashed var(--line); border-radius:8px; padding:12px; font-size:13.5px;}
.excerpt-gallery{display:flex; flex-direction:column; gap:10px;}
.excerpt-gallery img{width:100%; border:1px solid var(--line); border-radius:6px; display:block; cursor:zoom-in;}
.contact-line{font-size:13px; color:var(--ink-soft); line-height:1.6;}
::-webkit-scrollbar{width:9px;}
::-webkit-scrollbar-thumb{background:var(--line); border-radius:6px;}

/* ---------- password gate ---------- */
#gateOverlay{
  position:fixed; inset:0; z-index:500; background:var(--paper);
  display:flex; align-items:center; justify-content:center;
  padding: max(20px, env(safe-area-inset-top,0px)) 20px max(20px, env(safe-area-inset-bottom,0px));
}
#gateOverlay.hidden{display:none !important;}
.gate-card{ width:100%; max-width:380px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:32px 28px; }
.gate-card h1{ font-family:'Fraunces',serif; font-size:22px; font-weight:600; margin:0 0 4px; }
.gate-card p.sub{ font-size:13.5px; color:var(--ink-soft); margin:0 0 22px; }
.gate-card input[type=password]{
  width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:7px;
  background:var(--paper); color:var(--ink); font-size:15px; margin-bottom:12px; box-sizing:border-box;
}
.gate-card button{
  width:100%; padding:11px; border:none; border-radius:7px; background:var(--ink); color:var(--panel);
  font-size:14.5px; font-weight:600; cursor:pointer; font-family:inherit;
}
.gate-err{ color:#A8432F; font-size:13px; margin-top:10px; min-height:16px; }
#appRoot.hidden{display:none !important;}
</style>
</head>
<body>

<div id="gateOverlay">
  <div class="gate-card">
    <h1>Retail Acquisition Explorer</h1>
    <p class="sub">Enter the password to view the property list.</p>
    <form id="gateForm">
      <input type="password" id="gatePw" autofocus autocomplete="current-password" placeholder="Password">
      <button type="submit">Sign in</button>
      <div class="gate-err" id="gateErr"></div>
    </form>
  </div>
</div>

<div id="appRoot" class="hidden">

<header class="top">
  <div class="top-row">
    <h1>Retail Acquisition Explorer</h1>
    <div style="display:flex; align-items:center; gap:14px;">
      <span class="count"><span id="visibleCount">365</span> of <span id="totalCount">365</span> shopping centers</span>
      <button class="logout" id="logoutBtn">Log out</button>
    </div>
  </div>
</header>

<div class="filters">
  <input class="search-box" id="searchBox" type="text" placeholder="Search address or city…">

  <div class="f-group">
    <span class="f-label">Building SF</span>
    <div class="f-range"><input type="text" inputmode="numeric" id="sfMin" placeholder="Min"><span>–</span><input type="text" inputmode="numeric" id="sfMax" placeholder="Max"></div>
  </div>
  <div class="f-group">
    <span class="f-label">Price</span>
    <div class="f-range"><input type="text" inputmode="numeric" id="priceMin" placeholder="Min $"><span>–</span><input type="text" inputmode="numeric" id="priceMax" placeholder="Max $"></div>
  </div>
  <div class="f-group">
    <span class="f-label">Land Size (ac)</span>
    <div class="f-range"><input type="text" inputmode="decimal" id="landMin" placeholder="Min"><span>–</span><input type="text" inputmode="decimal" id="landMax" placeholder="Max"></div>
  </div>
  <div class="f-group">
    <span class="f-label">$/PSF Building</span>
    <div class="f-range"><input type="text" inputmode="decimal" id="psfMin" placeholder="Min"><span>–</span><input type="text" inputmode="decimal" id="psfMax" placeholder="Max"></div>
  </div>

  <div class="f-group">
    <span class="f-label">Sort</span>
    <select id="sortSel">
      <option value="address-asc">Address (A → Z)</option>
      <option value="price-asc">Price (low → high)</option>
      <option value="price-desc">Price (high → low)</option>
      <option value="psf-asc">$/PSF Building (low → high)</option>
      <option value="size-desc">Building Size (large → small)</option>
      <option value="drive-asc">Est. drive from Glendale</option>
    </select>
  </div>

  <button class="reset-link" id="resetBtn">Reset filters</button>
  <button class="reset-link" id="favToggle">♡ Favorites only</button>

  <div class="chip-row" id="countyChips" style="width:100%;"></div>
</div>

<div id="map"></div>

<div class="table-wrap">
  <table id="propTable">
    <thead>
      <tr>
        <th></th>
        <th data-key="address">Address</th>
        <th data-key="city">City</th>
        <th data-key="county">County</th>
        <th data-key="buildingSF" class="num">Building SF</th>
        <th data-key="landAC" class="num">Land (ac)</th>
        <th data-key="price" class="num">Price</th>
        <th data-key="psfBuilding" class="num">$/PSF Bldg</th>
        <th data-key="psfLand" class="num">$/PSF Land</th>
        <th>User Notes</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<div class="detail-overlay" id="detailOverlay">
  <div class="detail-panel" id="detailPanel"></div>
</div>

</div><!-- #appRoot -->

<script>
// ---------------- password gate (client-side, cosmetic only) ----------------
// Change the password by editing the string below. Not real security: this data
// is fully present in the page's HTML either way. Keeps casual visitors and
// search engines out; not a substitute for real auth if this ever holds
// something more sensitive than a property list.
const SITE_PASSWORD = "DAN";
const GATE_KEY = "rae_gate_ok";

const gateOverlay = document.getElementById('gateOverlay');
const appRoot = document.getElementById('appRoot');

function unlock(){
  gateOverlay.classList.add('hidden');
  appRoot.classList.remove('hidden');
  try{ sessionStorage.setItem(GATE_KEY, '1'); }catch(e){}
  window.dispatchEvent(new Event('rae:unlocked'));
}

try{
  if(sessionStorage.getItem(GATE_KEY) === '1'){ unlock(); }
}catch(e){}

document.getElementById('gateForm').addEventListener('submit', (e)=>{
  e.preventDefault();
  const pw = document.getElementById('gatePw').value;
  if(pw === SITE_PASSWORD){
    unlock();
  } else {
    document.getElementById('gateErr').textContent = 'Incorrect password.';
  }
});
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
async function loadJSON(path){ const r = await fetch(path); return r.json(); }

(async function init(){
  const DATA = await loadJSON('/data.json');
  document.getElementById('totalCount').textContent = DATA.length;
  let OMS = {};
  try { OMS = await loadJSON('/oms.json'); } catch(e) { OMS = {}; }

  let activeCounties = new Set();
  let sortMode = 'address-asc';
  let searchTerm = '';
  let selectedId = null;
  let filterState = { sfMin:null, sfMax:null, priceMin:null, priceMax:null, landMin:null, landMax:null, psfMin:null, psfMax:null };
  let sortDir = {};
  let favoritesOnly = false;

  // ---------------- favorites & notes (stored locally in this browser only) ----------------
  const FAV_KEY = 'rae_favorites';
  const NOTES_KEY = 'rae_notes';
  function loadFavorites(){
    try{ return new Set(JSON.parse(localStorage.getItem(FAV_KEY) || '[]')); }catch(e){ return new Set(); }
  }
  function saveFavorites(set){
    try{ localStorage.setItem(FAV_KEY, JSON.stringify([...set])); }catch(e){}
  }
  function loadNotes(){
    try{ return JSON.parse(localStorage.getItem(NOTES_KEY) || '{}'); }catch(e){ return {}; }
  }
  function saveNotes(obj){
    try{ localStorage.setItem(NOTES_KEY, JSON.stringify(obj)); }catch(e){}
  }
  let favorites = loadFavorites();
  let notesStore = loadNotes();
  function isFavorite(id){ return favorites.has(id); }
  function toggleFavorite(id){
    if(favorites.has(id)) favorites.delete(id); else favorites.add(id);
    saveFavorites(favorites);
  }
  function getNote(id){ return notesStore[id] || ''; }
  function setNote(id, text){
    if(text.trim() === ''){ delete notesStore[id]; } else { notesStore[id] = text; }
    saveNotes(notesStore);
  }

  const counties = [...new Set(DATA.map(d=>d.county))].sort();

  function fmtMoney(n){ return '$'+n.toLocaleString('en-US'); }
  function fmtSF(n){ return n.toLocaleString('en-US'); }
  function getCss(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim() || '#2B3A55'; }

  const chipRow = document.getElementById('countyChips');
  counties.forEach(c=>{
    const chip = document.createElement('div');
    chip.className='chip';
    chip.textContent = c + ' (' + DATA.filter(d=>d.county===c).length + ')';
    chip.addEventListener('click', ()=>{
      if(activeCounties.has(c)) activeCounties.delete(c); else activeCounties.add(c);
      chip.classList.toggle('active');
      render();
    });
    chipRow.appendChild(chip);
  });

  // ---- live number formatting for the range filter inputs ----
  // sf/price: whole numbers, comma-grouped ("1,000", "$1,000,000")
  // land/psf: decimals allowed, comma-grouped integer part ("1,000.5", "$2.50")
  const rangeConfig = {
    sfMin:{prefix:'',decimals:false}, sfMax:{prefix:'',decimals:false},
    priceMin:{prefix:'$',decimals:false}, priceMax:{prefix:'$',decimals:false},
    landMin:{prefix:'',decimals:true}, landMax:{prefix:'',decimals:true},
    psfMin:{prefix:'$',decimals:true}, psfMax:{prefix:'$',decimals:true},
  };
  function parseFormatted(str){
    if(!str) return null;
    const cleaned = str.replace(/[^0-9.]/g, '');
    if(cleaned === '' || cleaned === '.') return null;
    const n = parseFloat(cleaned);
    return isNaN(n) ? null : n;
  }
  function formatLive(str, cfg){
    let cleaned = str.replace(/[^0-9.]/g, '');
    if(!cfg.decimals) cleaned = cleaned.replace(/\./g, '');
    // keep only the first decimal point
    const firstDot = cleaned.indexOf('.');
    if(firstDot !== -1){
      cleaned = cleaned.slice(0, firstDot+1) + cleaned.slice(firstDot+1).replace(/\./g, '');
    }
    if(cleaned === '') return '';
    let [intPart, decPart] = cleaned.split('.');
    intPart = intPart.replace(/^0+(?=\d)/, '');
    const withCommas = intPart === '' ? '' : parseInt(intPart, 10).toLocaleString('en-US');
    let out = cfg.prefix + (withCommas || (intPart === '' ? '' : '0'));
    if(decPart !== undefined) out += '.' + decPart;
    return out;
  }

  const rangeIds = ['sfMin','sfMax','priceMin','priceMax','landMin','landMax','psfMin','psfMax'];
  rangeIds.forEach(id=>{
    const el = document.getElementById(id);
    const cfg = rangeConfig[id];
    el.addEventListener('input', (e)=>{
      const formatted = formatLive(e.target.value, cfg);
      e.target.value = formatted;
      filterState[id] = parseFormatted(formatted);
      render();
    });
  });

  document.getElementById('resetBtn').addEventListener('click', ()=>{
    activeCounties.clear();
    document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
    document.getElementById('searchBox').value=''; searchTerm='';
    document.getElementById('sortSel').value='address-asc'; sortMode='address-asc';
    rangeIds.forEach(id=>{ document.getElementById(id).value=''; filterState[id]=null; });
    favoritesOnly = false;
    document.getElementById('favToggle').classList.remove('active');
    document.getElementById('favToggle').textContent = '♡ Favorites only';
    render();
  });
  document.getElementById('favToggle').addEventListener('click', (e)=>{
    favoritesOnly = !favoritesOnly;
    e.target.classList.toggle('active', favoritesOnly);
    e.target.textContent = favoritesOnly ? '♥ Favorites only' : '♡ Favorites only';
    render();
  });
  document.getElementById('searchBox').addEventListener('input', (e)=>{ searchTerm=e.target.value.trim().toLowerCase(); render(); });
  document.getElementById('sortSel').addEventListener('change', (e)=>{ sortMode=e.target.value; render(); });
  document.getElementById('logoutBtn').addEventListener('click', ()=>{
    try{ sessionStorage.removeItem('rae_gate_ok'); }catch(e){}
    location.reload();
  });

  document.querySelectorAll('thead th').forEach(th=>{
    if(!th.dataset.key) return;
    th.addEventListener('click', ()=>{
      const key = th.dataset.key;
      sortDir[key] = (sortDir[key]||1) * -1;
      sortMode = 'col:'+key;
      document.querySelectorAll('thead th').forEach(t=>t.classList.remove('sorted'));
      th.classList.add('sorted');
      render();
    });
  });

  function filteredSorted(){
    let list = DATA.filter(d=>{
      if(favoritesOnly && !isFavorite(d.id)) return false;
      if(activeCounties.size && !activeCounties.has(d.county)) return false;
      if(searchTerm && !(d.address.toLowerCase().includes(searchTerm) || d.city.toLowerCase().includes(searchTerm))) return false;
      if(filterState.sfMin!=null && d.buildingSF < filterState.sfMin) return false;
      if(filterState.sfMax!=null && d.buildingSF > filterState.sfMax) return false;
      if(filterState.priceMin!=null && d.price < filterState.priceMin) return false;
      if(filterState.priceMax!=null && d.price > filterState.priceMax) return false;
      if(filterState.landMin!=null && (d.landAC==null || d.landAC < filterState.landMin)) return false;
      if(filterState.landMax!=null && (d.landAC==null || d.landAC > filterState.landMax)) return false;
      if(filterState.psfMin!=null && d.psfBuilding < filterState.psfMin) return false;
      if(filterState.psfMax!=null && d.psfBuilding > filterState.psfMax) return false;
      return true;
    });
    if(sortMode.startsWith('col:')){
      const key = sortMode.slice(4);
      const dir = sortDir[key]||1;
      list.sort((a,b)=>{
        let av=a[key], bv=b[key];
        if(av==null) av = typeof bv==='number' ? -Infinity : '';
        if(bv==null) bv = typeof av==='number' ? -Infinity : '';
        if(typeof av === 'string') return dir*av.localeCompare(bv);
        return dir*(av-bv);
      });
    } else {
      const cmp = {
        'address-asc': (a,b)=>a.address.localeCompare(b.address),
        'price-asc': (a,b)=>a.price-b.price,
        'price-desc': (a,b)=>b.price-a.price,
        'psf-asc': (a,b)=>a.psfBuilding-b.psfBuilding,
        'size-desc': (a,b)=>b.buildingSF-a.buildingSF,
        'drive-asc': (a,b)=>(a.driveMi||9999)-(b.driveMi||9999),
      }[sortMode];
      list.sort(cmp);
    }
    return list;
  }

  const dataPoints = DATA.filter(d=>d.lat!=null).map(d=>[d.lat,d.lon]);
  const initialBounds = L.latLngBounds(dataPoints);

  const map = L.map('map', {zoomControl:true});
  map.fitBounds(initialBounds, {padding:[24,24]});
  const tileLayer = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 19
  }).addTo(map);
  let tileLoadFailed = false;
  tileLayer.on('tileerror', () => {
    if (tileLoadFailed) return;
    tileLoadFailed = true;
    const mapDiv = document.getElementById('map');
    const notice = document.createElement('div');
    notice.style.cssText = 'position:absolute;top:8px;left:8px;z-index:1000;background:#fff;border:1px solid #D7DCE1;border-radius:6px;padding:6px 10px;font-size:12px;color:#5B6B7A;max-width:260px;';
    notice.textContent = 'Map tiles failed to load (network/ad-blocker may be blocking openstreetmap.org) — pins below are still accurate, just without street map underneath.';
    mapDiv.appendChild(notice);
  });

  const RecenterControl = L.Control.extend({
    options: { position: 'topleft' },
    onAdd: function(){
      const btn = L.DomUtil.create('button', 'leaflet-bar recenter-btn');
      btn.type = 'button';
      btn.title = 'Recenter map';
      btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>';
      L.DomEvent.disableClickPropagation(btn);
      L.DomEvent.on(btn, 'click', ()=> map.fitBounds(initialBounds, {padding:[24,24]}));
      return btn;
    }
  });
  map.addControl(new RecenterControl());

  // The map is built while the page may still be behind the password gate
  // (i.e. the #map div is display:none, so it has zero width/height at this
  // point). Leaflet caches that zero size internally and won't self-correct
  // when the gate later opens, so we explicitly recompute the size and
  // re-fit the view once the app becomes visible.
  function refreshMapSize(){
    map.invalidateSize();
    map.fitBounds(initialBounds, {padding:[24,24]});
  }
  if(!appRoot.classList.contains('hidden')){
    refreshMapSize();
  }
  window.addEventListener('rae:unlocked', refreshMapSize);

  let markerLayer = L.layerGroup().addTo(map);
  const markerIndex = {};

  function buildMarkers(list){
    markerLayer.clearLayers();
    list.forEach(d=>{
      if(d.lat==null) return;
      const liked = isFavorite(d.id);
      const color = liked ? getCss('--liked') : getCss('--pin');
      const size = liked ? 10 : 8;
      const icon = L.divIcon({
        html:`<div class="marker-pin" style="width:${size}px;height:${size}px;background:${color}"></div>`,
        className:'', iconSize:[size,size], iconAnchor:[size/2,size/2]
      });
      const m = L.marker([d.lat,d.lon], {icon});
      m.bindPopup(`<b>${liked?'♥ ':''}${d.address}</b><br>${d.city}, ${d.county} Co.<br>${fmtMoney(d.price)} · $${d.psfBuilding}/SF<br><button class="popup-detail-btn" onclick="window.__raeOpenDetail('${d.id}')">View details →</button>`);
      m.on('click', ()=>openDetail(d.id));
      markerIndex[d.id]=m;
      markerLayer.addLayer(m);
    });
  }

  const tbody = document.getElementById('tableBody');
  function buildTable(list){
    document.getElementById('visibleCount').textContent = list.length;
    const rows = list.map(d=>{
      const liked = isFavorite(d.id);
      const note = getNote(d.id);
      return `
      <tr data-id="${d.id}">
        <td class="heart-cell"><button class="heart-btn" data-heart-id="${d.id}" title="${liked?'Remove from favorites':'Add to favorites'}">${liked?'♥':'♡'}</button></td>
        <td>${d.address}</td>
        <td>${d.city}</td>
        <td>${d.county}</td>
        <td class="num">${fmtSF(d.buildingSF)}</td>
        <td class="num">${d.landAC!=null?d.landAC:'—'}</td>
        <td class="num">${fmtMoney(d.price)}</td>
        <td class="num">$${d.psfBuilding}</td>
        <td class="num">${d.psfLand!=null?'$'+d.psfLand:'—'}</td>
        <td class="notes-cell${note?'':' empty'}">${note ? note.replace(/</g,'&lt;') : 'No notes'}</td>
      </tr>`;
    }).join('');
    tbody.innerHTML = rows;
    tbody.querySelectorAll('tr').forEach(tr=>{
      tr.addEventListener('click', (e)=>{
        if(e.target.closest('.heart-btn')) return;
        openDetail(tr.dataset.id, true);
      });
    });
    tbody.querySelectorAll('.heart-btn').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        const id = btn.dataset.heartId;
        toggleFavorite(id);
        render();
      });
    });
  }

  function render(){
    const list = filteredSorted();
    buildTable(list);
    buildMarkers(list);
  }

  const overlay = document.getElementById('detailOverlay');
  const panel = document.getElementById('detailPanel');
  function stat(label, value){ return `<div class="stat"><div class="stat-label">${label}</div><div class="stat-value">${value}</div></div>`; }

  function openDetail(id, panMap){
    selectedId = id;
    const d = DATA.find(x=>x.id===id);
    if(!d) return;
    if(panMap && d.lat!=null){ map.setView([d.lat,d.lon], 12, {animate:true}); markerIndex[id] && markerIndex[id].openPopup(); }
    const om = OMS[d.id];
    const excerpts = d.excerptImages || [];

    panel.innerHTML = `
      <button class="detail-close" id="closeBtn">✕</button>
      <div class="d-heart-row">
        <div class="d-addr" style="margin:0;">${d.address}</div>
        <button class="heart-btn" id="detailHeartBtn" title="${isFavorite(d.id)?'Remove from favorites':'Add to favorites'}">${isFavorite(d.id)?'♥':'♡'}</button>
      </div>
      <div class="d-sub">${d.city}, ${d.county} County · ${d.zip} · ${d.submarket} (${d.market})</div>
      <div class="stat-grid">
        ${stat('Building Size', fmtSF(d.buildingSF)+' SF')}
        ${stat('Land Size', d.landAC!=null? d.landAC+' ac':'—')}
        ${stat('Sale Price', fmtMoney(d.price))}
        ${stat('$/PSF Building', '$'+d.psfBuilding)}
        ${stat('$/PSF Land', d.psfLand!=null? '$'+d.psfLand:'—')}
        ${stat('% Leased', d.leased!=null? d.leased+'%':'Not reported')}
        ${stat('Investment Type', d.investType||'—')}
        ${stat('Building Class / Year', (d.bldgClass||'—')+' · '+(d.yearBuilt||'—'))}
        ${stat('Est. Drive from Glendale', d.driveMi!=null? '~'+Math.round(d.driveMi*1.25/62*60)+' min ('+d.driveMi+' mi)':'—')}
        ${stat('Tenant Mix (CoStar)', d.secType||'—')}
      </div>
      ${d.propertyDesc ? `<div class="d-section"><h4>Property</h4><p>${d.propertyDesc}</p></div>` : ''}
      ${d.tenantDesc ? `<div class="d-section"><h4>Tenancy</h4><p>${d.tenantDesc}</p></div>` : ''}
      ${d.cityDesc ? `<div class="d-section"><h4>Location</h4><p>${d.cityDesc}</p></div>` : ''}
      <div class="d-section">
        <h4>Broker of Record</h4>
        <div class="contact-line">${d.salesCompany || 'Not listed'}${d.salesContact? ' · '+d.salesContact : ''}${d.salesPhone? ' · '+d.salesPhone : ''}</div>
      </div>
      <div class="btn-row">
        <a class="btn primary" href="${d.gmaps}" target="_blank" rel="noopener">Open in Google Maps</a>
      </div>
      <div class="d-section" style="margin-top:18px;">
        <h4>User Notes</h4>
        <textarea id="notesBox" placeholder="Notes are saved in this browser only — not shared with other users or devices.">${getNote(d.id)}</textarea>
        <div class="notes-saved" id="notesSaved"></div>
      </div>
      <div class="d-section" style="margin-top:18px;">
        <h4>Listing Flyer</h4>
        ${excerpts.length ? `<div class="excerpt-gallery">${excerpts.map(img=>`<img src="${img}" alt="Listing flyer page" onclick="window.open('${img}','_blank')">`).join('')}</div>` : `<p class="empty-note">No flyer excerpt available for this property.</p>`}
      </div>
      <div class="d-section" style="margin-top:18px;">
        <h4>Offering Memorandum</h4>
        <div class="om-box">${om ? `<a class="btn brass" href="${om}" target="_blank" rel="noopener">📄 View OM</a>` : `<span class="empty-note">No OM attached. Add the PDF to the repo root and a line to oms.json to attach one (see README).</span>`}</div>
      </div>
    `;
    document.getElementById('closeBtn').addEventListener('click', closeDetail);
    document.getElementById('detailHeartBtn').addEventListener('click', (e)=>{
      toggleFavorite(d.id);
      const liked = isFavorite(d.id);
      e.target.textContent = liked ? '♥' : '♡';
      e.target.title = liked ? 'Remove from favorites' : 'Add to favorites';
      buildTable(filteredSorted());
      buildMarkers(filteredSorted());
    });
    let notesTimer = null;
    const notesBox = document.getElementById('notesBox');
    const notesSaved = document.getElementById('notesSaved');
    notesBox.addEventListener('input', ()=>{
      clearTimeout(notesTimer);
      notesSaved.textContent = '';
      notesTimer = setTimeout(()=>{
        setNote(d.id, notesBox.value);
        notesSaved.textContent = 'Saved (this browser only)';
        buildTable(filteredSorted());
      }, 400);
    });
    overlay.classList.add('open');
  }
  function closeDetail(){ overlay.classList.remove('open'); selectedId=null; }
  window.__raeOpenDetail = (id) => openDetail(id, true);
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeDetail(); });

  render();
})();
</script>
</body>
</html>
